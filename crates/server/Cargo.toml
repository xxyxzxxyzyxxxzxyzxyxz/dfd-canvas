[package]
name = "dfd-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Static file server for the DFD Canvas web application"
license = "MIT"
publish = false

[dependencies]
axum = "=0.8.9"
clap = { version = "4", features = ["derive"] }
percent-encoding = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "=0.7.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
