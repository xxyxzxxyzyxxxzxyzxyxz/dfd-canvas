[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Development and verification tools for DFD Canvas"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chromiumoxide = { version = "=0.9.1", default-features = false }
dfd-canvas = { path = "../.." }
dfd-server = { path = "../server" }
flate2 = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
