[package]
name = "dfd-canvas"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A browser-based data flow diagram editor built with Rust and WebAssembly"
license = "MIT"
readme = "README.md"
publish = false

[workspace]
members = ["crates/server", "crates/xtask"]
default-members = ["."]
resolver = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.8.20", default-features = false, features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "HtmlAnchorElement", "SvgsvgElement", "DomRect", "PointerEvent", "MouseEvent", "WheelEvent", "KeyboardEvent", "FocusEvent", "EventTarget", "Storage", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "Navigator", "Clipboard", "BeforeUnloadEvent"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# CDP's generated types are large; avoid debug information in local tool builds.
[profile.dev]
debug = 0
